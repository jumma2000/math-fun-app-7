name: quizapp2
description: "تطبيق اختبار الكسور - مشروع تعليمي تفاعلي"
version: 1.0.0

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:      # ✅ دعم اللغة العربية
    sdk: flutter
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ====== الأصول (Assets) ======
  assets:
    # - assets/images/   # تم التعليق لأن المجلد قد لا يكون موجوداً

  # ====== الخطوط (Fonts) ======
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400

    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf
          weight: 400